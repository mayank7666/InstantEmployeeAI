name: Backend API Tests

on:
  push:
    paths:
      - "Instant_Employee_AI/backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "Instant_Employee_AI/backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Instant_Employee_AI/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Instant_Employee_AI/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile main.py
      - name: Run API tests
        run: pytest -q
