databases:
  - name: instant-employee-db
    databaseName: instant_employee
    user: instant_employee
    plan: free

services:
  - type: web
    name: instant-employee-api
    runtime: python
    plan: free
    rootDir: Instant_Employee_AI/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: instant-employee-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://instantemployeeai-lytc5dwycxkea4ymckbnuj.streamlit.app
